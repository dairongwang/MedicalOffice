# Everything in containers, for a local try-out: PostgreSQL, the API (which also serves the patients'
# app), the staff dashboard and the office administration dashboard.
#
#   python dev.py docker          (= docker compose up --build)
#
#   patients' app       http://localhost:8000/            (API docs: http://localhost:8000/api/docs)
#   staff dashboard     http://localhost:4300/
#   office dashboard    http://localhost:4400/
#   test inbox          http://localhost:8000/api/v1/messages/fake/outbox
#
# APP_ENV=dev: the dummy data (dummy-*@example.com / Dummy-<Kind>-pass-123) and the built-in fakes are on.
# Every secret below is a DUMMY for this local setup — a real deployment sets its own (see README.md).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medic
      POSTGRES_PASSWORD: dummy-postgres-password
      POSTGRES_DB: assistant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medic -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: services/account/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://medic:dummy-postgres-password@db:5432/assistant
      TOKEN_SECRET: ${TOKEN_SECRET:-dummy-docker-token-secret-not-for-production}
      RELEASE_ADMIN_TOKEN: dummy-release-admin-token
      SEED_FAKE_ACCOUNTS: "true"
      CORS_ORIGINS: http://localhost:4300,http://127.0.0.1:4300,http://localhost:4400,http://127.0.0.1:4400
      STAFF_URL: http://localhost:4300/
      ADMIN_DASHBOARD_URL: http://localhost:4400/
      WEB_APP_URL: http://localhost:8000/
      OFFICE_NAME: Medic Office
      OFFICE_ADDRESS: 1 Example Street, Exampleville (dummy)
      OFFICE_PHONE: +1 555 010 0000
      OFFICE_TIMEZONE: ${OFFICE_TIMEZONE:-UTC}
    ports:
      - "8000:8000"
    volumes:
      - apidata:/app/data
    depends_on:
      db:
        condition: service_healthy

  staff:
    build: apps/staff
    environment:
      API_BASE: http://localhost:8000
      SHOW_DUMMY_HINT: "true"
    ports:
      - "4300:80"
    depends_on:
      - api

  admin:
    build: apps/admin
    environment:
      API_BASE: http://localhost:8000
      SHOW_DUMMY_HINT: "true"
    ports:
      - "4400:80"
    depends_on:
      - api

volumes:
  pgdata:
  apidata:
